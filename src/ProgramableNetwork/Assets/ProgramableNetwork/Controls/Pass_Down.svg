<?xml version="1.0" encoding="UTF-8"?>
<!-- Pass-through gate knob, arrow DOWN (signal passing). Monochrome so the runtime
     state-tint (which MULTIPLIES) reads correctly: black ring / gray bezel / white
     face (takes the full tint) / near-black arrow (stays dark).  Arrow down = the
     gate is passing the input straight through. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
    <circle cx="64" cy="64" r="52" fill="none" stroke="#000000" stroke-width="6"/>
    <circle cx="64" cy="64" r="46" fill="#808080" stroke="#1c1c1c" stroke-width="3"/>
    <circle cx="64" cy="64" r="35" fill="#ffffff" stroke="#1c1c1c" stroke-width="3"/>
    <g transform="rotate(0, 64, 64)">
        <line x1="64" y1="40" x2="64" y2="70" stroke="#1c1c1c" stroke-width="9" stroke-linecap="round"/>
        <polygon points="50,68 78,68 64,88" fill="#1c1c1c"/>
    </g>
</svg>
