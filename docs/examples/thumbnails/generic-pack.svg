<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Generic asset pack: crate + gear. Neutral starting point for any pack. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#39424c"/>
      <stop offset="1" stop-color="#20262d"/>
    </linearGradient>
    <linearGradient id="crate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9963a"/>
      <stop offset="1" stop-color="#a86d22"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="28" fill="url(#bg)"/>
  <circle cx="128" cy="120" r="86" fill="#ffffff" opacity="0.05"/>

  <!-- gear behind the crate -->
  <g fill="#5b6675" transform="translate(178 74)">
    <circle r="38"/>
    <g fill="#5b6675">
      <rect x="-7" y="-50" width="14" height="18" rx="3"/>
      <rect x="-7" y="32" width="14" height="18" rx="3"/>
      <rect x="-50" y="-7" width="18" height="14" rx="3"/>
      <rect x="32" y="-7" width="18" height="14" rx="3"/>
      <rect x="-7" y="-50" width="14" height="18" rx="3" transform="rotate(45)"/>
      <rect x="-7" y="32" width="14" height="18" rx="3" transform="rotate(45)"/>
      <rect x="-50" y="-7" width="18" height="14" rx="3" transform="rotate(45)"/>
      <rect x="32" y="-7" width="18" height="14" rx="3" transform="rotate(45)"/>
    </g>
    <circle r="14" fill="#20262d"/>
  </g>

  <!-- crate -->
  <g>
    <rect x="52" y="96" width="126" height="112" rx="8" fill="url(#crate)"/>
    <rect x="52" y="96" width="126" height="20" rx="8" fill="#f0b45a"/>
    <path d="M60 116 L170 200 M170 116 L60 200" stroke="#8a5718" stroke-width="11" stroke-linecap="round"/>
    <rect x="52" y="96" width="126" height="112" rx="8" fill="none" stroke="#20262d" stroke-width="6"/>
  </g>
</svg>
